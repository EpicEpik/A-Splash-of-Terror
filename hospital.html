<!DOCTYPE html>
<html>
<head>
  <title>Hospital Scene</title>
  <meta charset="UTF-8">
  <style>
    body {
      background: white;
      font-family: monospace;
    }

    #hospital {
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #dialogueBox {
      background: #eee;
      padding: 20px;
      border: 3px solid black;
      width: 600px;
    }

    #dialogueText {
      font-size: 20px;
      white-space: pre-line;
    }
  </style>
</head>

<body>
  <div id="hospital">
    <div id="dialogueBox">
      <p id="dialogueText"></p>
    </div>
  </div>

  <script>
    const dialogue = [
      "Nurse: Lauren? Lauren, wake up.",
      "You: W-Where am I? Where are my parents?",
      "Nurse: You were in a car accident, sweetie.",
      "You: My parents!?",
      "Nurse: I'm so sorry, sweetie, but, they passed in the accident.",
      "You: What!?",
      "Nurse: We're going to have to send you to the orph-",
      "You: No!!",
      "Nurse: Lauren, come back! You can't just LEAVE!"
    ];

    let index = 0;

    function nextLine() {
      if (index < dialogue.length) {
        document.getElementById("dialogueText").textContent = dialogue[index];
        index++;
      }
    }

    nextLine();

    document.addEventListener("click", nextLine);
  </script>
</body>
</html>
